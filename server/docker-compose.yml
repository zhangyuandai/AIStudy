# ============================================================
#  滑板公社 Docker Compose 编排
#  包含: API服务 + MySQL + Nginx反代
#
#  使用方法:
#    1. cp .env.example .env && 编辑配置
#    2. docker compose up -d
# ============================================================

version: "3.8"

services:
  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: skate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-skate_root_2026}
      MYSQL_DATABASE: ${DB_NAME:-skate_club}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max_connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-skate_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - skate-net

  # ---- API 服务 ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skate-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - skate-net

  # ---- Nginx 反代（可选，用于统一入口）----
  nginx:
    image: nginx:1.25-alpine
    container_name: skate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin/dist:/usr/share/nginx/html/admin:ro   # PC管理后台静态文件
      - ./uploads:/usr/share/nginx/uploads:ro           # 上传文件
      # SSL证书（启用HTTPS时取消注释）
      #- ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      #- ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - api
    networks:
      - skate-net

volumes:
  mysql_data:
    driver: local

networks:
  skate-net:
    driver: bridge
